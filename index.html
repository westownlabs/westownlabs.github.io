<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Westown Labs</title>
  <meta name="description" content="Westown Labs builds fun, fast multiplayer games for mobile.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 500px;
      text-align: center;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      margin-bottom: 16px;
    }
    .tagline {
      font-size: 16px;
      color: #888;
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .products {
      margin-bottom: 40px;
    }
    .product {
      display: inline-block;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 20px 28px;
      text-decoration: none;
      color: #e0e0e0;
      transition: border-color 0.2s;
    }
    .product:hover {
      border-color: #00A6A6;
    }
    .product-name {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .product-desc {
      font-size: 13px;
      color: #888;
    }
    .contact {
      font-size: 13px;
      color: #555;
    }
    .contact a {
      color: #888;
      text-decoration: none;
    }
    .contact a:hover {
      color: #00A6A6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Westown Labs</h1>
    <p class="tagline">We build fun, fast multiplayer games for mobile.</p>

    <div class="products">
      <a class="product" href="https://5secondanimal.com">
        <div class="product-name">5 Second Animal</div>
        <div class="product-desc">Draw fast. Draw bad.</div>
      </a>
    </div>

    <p class="contact">
      <a href="mailto:5secondanimal@gmail.com">Contact</a>
    </p>
  </div>
</body>
</html>
